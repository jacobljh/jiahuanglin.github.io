<!doctype html><meta charset="utf-8"><title>QA</title>
<!-- Layout QA harness, driven by qa_layout.py (headless Chrome). Query: ?series=wm&dir=world_models&w=375[&only=05][&index=1][&dbg=1].
     Loads every lesson of a series in an iframe of width w, moves the first range slider to min/mid/max and, after each move, lets the widget
     redraw and checks the final frame: overlapping canvas text, text outside the canvas, NaN/undefined text, page-level horizontal overflow
     (with the offending elements), and script errors. requestAnimationFrame is replaced by timers because headless virtual time has no frames. -->
<body style="margin:0"><pre id="out">running</pre>
<script>
// Headless QA harness (temporary, untracked). ?dir=world_models_new&series=wm&w=375
(async function () {
  var q = new URLSearchParams(location.search);
  var dir = q.get('dir'), series = q.get('series'), W = +q.get('w') || 375, only = q.get('only');
  var baton = await (await fetch('/tools/chain/batons_' + series + '.json')).json();
  var lessons = baton.lessons.map(function (L) { return L.slug + '.html'; });
  if (q.get('index')) lessons.unshift('index.html');
  if (only) lessons = lessons.filter(function (s) { return s.slice(0, 2) === only; });
  var res = [];
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  async function one(file) {
    var f = document.createElement('iframe');
    f.style.cssText = 'width:' + W + 'px;height:900px;border:0;position:absolute;left:0;top:0';
    document.body.appendChild(f);
    var errs = [];
    f.src = '/all_lessons/' + dir + '/' + file;
    await new Promise(function (r) { f.onload = r; });
    var w = f.contentWindow, d = w.document;
    w.requestAnimationFrame = function (cb) { return w.setTimeout(function () { cb(w.performance.now()); }, 16); };
    w.cancelAnimationFrame = function (id) { w.clearTimeout(id); };
    w.addEventListener('error', function (e) { errs.push(String(e.message).slice(0, 120)); });
    var P = w.CanvasRenderingContext2D.prototype, orig = P.fillText, B = [];
    P.fillText = function (t, x, y) {
      try {
        var wd = this.measureText(String(t)).width, fm = this.font.match(/([\d.]+)px/), h = fm ? parseFloat(fm[1]) : 10, al = this.textAlign;
        var x0 = al === 'center' ? x - wd / 2 : (al === 'right' || al === 'end') ? x - wd : x;
        B.push([String(t), x0, x0 + wd, y - h * 0.5, y + h * 0.5, this.canvas && this.canvas.clientWidth]);
      } catch (e) {}
      return orig.apply(this, arguments);
    };
    var cvs = d.querySelectorAll('.widget canvas');
    var r = d.querySelector('.widget input[type=range]');
    var seen = {}, out = [], off = {}, bad = {};
    async function probe(tag, setVal) {
      if (r && setVal !== undefined) { r.value = String(setVal); r.dispatchEvent(new w.Event('input', { bubbles: true })); r.dispatchEvent(new w.Event('change', { bubbles: true })); }
      await sleep(1600);
      B.length = 0;
      w.dispatchEvent(new w.Event('resize'));
      await sleep(200);
      for (var i = 0; i < B.length; i++) {
        var a = B[i];
        if (/NaN|undefined|Infinity|\[object/.test(a[0])) bad[a[0].slice(0, 30)] = 1;
        if (a[1] < -1 || a[2] > a[5] + 1) off[a[0].slice(0, 30) + (q.get('dbg') ? ' [' + Math.round(a[1]) + ',' + Math.round(a[2]) + ' of ' + a[5] + ']' : '')] = 1;
        for (var j = i + 1; j < B.length; j++) {
          var b = B[j];
          if (a[0] === b[0] && Math.abs(a[1] - b[1]) < 0.5 && Math.abs(a[3] - b[3]) < 0.5) continue;
          var ox = Math.min(a[2], b[2]) - Math.max(a[1], b[1]), oy = Math.min(a[4], b[4]) - Math.max(a[3], b[3]);
          if (ox > 3 && oy > 3) { var k = a[0].slice(0, 22) + ' | ' + b[0].slice(0, 22); if (!seen[k]) { seen[k] = tag; out.push(k + ' @' + tag); if (q.get('dbg')) out.push(JSON.stringify([a.slice(0,5).map(function(v){return typeof v==='number'?Math.round(v):v}), b.slice(0,5).map(function(v){return typeof v==='number'?Math.round(v):v}), i, j, B.length])); } }
        }
      }
      return B.length;
    }
    var nText = await probe('init');
    if (r) {
      var lo = +r.min, hi = +r.max, orgv = r.value;
      for (var s = 0; s < 3; s++) {
        nText = Math.max(nText, await probe(['min', 'mid', 'max'][s], lo + (hi - lo) * [0, 0.5, 1][s]));
      }
      await probe('back', orgv);
    }
    var de = d.documentElement;
    var hov = de.scrollWidth - de.clientWidth, offend = [];
    if (hov > 0) {
      var all = d.body.querySelectorAll('*'), cwid = de.clientWidth;
      for (var ei = 0; ei < all.length && offend.length < 4; ei++) {
        var el = all[ei], rc = el.getBoundingClientRect();
        if (rc.right <= cwid + 1 || rc.width === 0) continue;
        var hidden = false, an = el.parentElement;
        while (an && an !== d.body && an !== de) { var ov = w.getComputedStyle(an).overflowX; if (ov === 'auto' || ov === 'scroll' || ov === 'hidden' || ov === 'clip') { hidden = true; break; } an = an.parentElement; }
        if (hidden) continue;
        offend.push(el.tagName.toLowerCase() + (el.className && typeof el.className === 'string' ? '.' + el.className.split(' ')[0] : '') + ' r=' + Math.round(rc.right) + ' "' + (el.textContent || '').trim().slice(0, 30).replace(/\s+/g, ' ') + '"');
      }
    }
    P.fillText = orig;
    res.push({ f: file.slice(0, 2), n: nText, canv: cvs.length, cw: cvs[0] ? cvs[0].clientWidth : 0, hov: hov, offend: offend, overlaps: out.slice(0, 8), noverlap: out.length, off: Object.keys(off).slice(0, 5), bad: Object.keys(bad).slice(0, 4), errs: errs.slice(0, 3) });
    f.remove();
  }
  for (var i = 0; i < lessons.length; i++) {
    try { await one(lessons[i]); } catch (e) { res.push({ f: lessons[i].slice(0, 2), fatal: String(e).slice(0, 160) }); }
    document.getElementById('out').textContent = 'progress ' + (i + 1) + '/' + lessons.length;
  }
  document.getElementById('out').textContent = 'RESULT' + JSON.stringify(res) + 'ENDRESULT';
  document.title = 'DONE';
})();
</script>
